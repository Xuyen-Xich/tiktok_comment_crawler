[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktok-social-listening"
version = "0.1.0"
description = "Classroom-friendly TikTok comments crawler using async Playwright."
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.45.0",
  "playwright-stealth>=1.0.6",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "typer>=0.12.3",
  "beautifulsoup4>=4.12.3",
  "pandas>=2.2.2",
  "openpyxl>=3.1.2",
  "pyarrow>=16.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "pytest-asyncio>=0.23.7"]
notebook = ["jupyter>=1.0.0", "matplotlib>=3.8.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

